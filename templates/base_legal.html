<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{% endblock %} | {{ site_name }}</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<style>
  body { font-family: "Segoe UI", Arial, sans-serif; margin: 0; background: #f4f6fa;
         color: #1f2937; line-height: 1.6; }
  header { background: #1e3a5f; padding: 14px 24px; }
  header a { color: white; text-decoration: none; font-weight: 600; }
  main { max-width: 760px; margin: 24px auto; background: white; padding: 8px 32px 32px;
         border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
  h1 { font-size: 26px; margin-bottom: 4px; }
  h2 { font-size: 18px; margin-top: 28px; }
  .meta { color: #6b7280; font-size: 14px; margin-top: 0; }
  a { color: #1e3a5f; }
  footer { text-align: center; padding: 24px; font-size: 13px; color: #6b7280; }
  footer a { margin: 0 8px; }
  footer p { margin: 4px 0; }
</style>
</head>
<body>
<header><a href="/dashboard">{{ site_name }}</a></header>
<main>
{% block content %}{% endblock %}
</main>
<footer>
  <a href="/privacy">Privacy Policy</a>
  <a href="/terms">Terms and Conditions</a>
  <p>© 2026 {{ operator_name }}. All rights reserved.</p>
</footer>
</body>
</html>
